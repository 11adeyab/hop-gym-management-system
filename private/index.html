<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOP Boxing Academy — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:    #0F71F0;
            --primary-bg: #B2D4FC;
            --bg:         #F4F4F4;
            --white:      #FFFFFF;
            --border:     #E0E0E0;
            --text:       #1A1A1A;
            --muted:      #A1A1A1;
            --danger:     #D40404;
            --danger-bg:  rgba(212,4,4,0.08);
            --success:    #16A34A;
            --success-bg: rgba(22,163,74,0.10);
            --warning:    #D97706;
            --warning-bg: rgba(217,119,6,0.10);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* ── App shell ── */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        #sidebar {
            width: 220px;
            height: 100%;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-brand {
            background: var(--primary);
            color: white;
            padding: 18px 16px;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .brand-user {
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 4px;
            opacity: 0.85;
        }

        nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 6px 0;
            overflow-y: auto;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            padding: 11px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-left: 3px solid transparent;
            transition: background 0.1s;
            display: block;
        }

        nav a:hover { background: var(--bg); }

        nav a.active {
            color: var(--primary);
            border-left-color: var(--primary);
            background: rgba(15,113,240,0.06);
        }

        .sidebar-footer {
            border-top: 1px solid var(--border);
        }

        .nav-logout {
            display: block;
            color: var(--muted);
            text-decoration: none;
            padding: 11px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-left: 3px solid transparent;
            transition: background 0.1s, color 0.1s;
        }

        .nav-logout:hover {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* ── Main wrap ── */
        .main-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mobile-topbar {
            display: none;
            align-items: center;
            gap: 14px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            height: 50px;
            flex-shrink: 0;
        }

        .hamburger-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text);
            padding: 2px 4px;
            line-height: 1;
        }

        .mobile-brand {
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--primary);
        }

        main {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            background: var(--bg);
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }

        h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; }

        /* ── Buttons ── */
        button { cursor: pointer; font-family: inherit; }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px 20px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: background 0.1s;
        }

        .btn-primary:hover { background: #0c5fd4; }
        .btn-primary:disabled { background: var(--muted); cursor: not-allowed; }

        .btn-ghost {
            background: var(--white);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            font-size: 0.82rem;
            font-weight: 600;
            transition: background 0.1s;
        }

        .btn-ghost:hover { background: var(--bg); }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.82rem;
            font-weight: 700;
            transition: background 0.1s;
        }

        .btn-danger:hover { background: #b30303; }

        .btn-sm { padding: 5px 12px; font-size: 0.78rem; }

        /* ── Overview ── */
        .view-greeting { margin-bottom: 24px; }

        .view-greeting h2 {
            font-size: 1.35rem;
            text-transform: none;
            letter-spacing: 0;
            margin-bottom: 4px;
        }

        .greeting-sub {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            margin-bottom: 28px;
        }

        .stat-box {
            background: var(--white);
            padding: 18px 20px;
        }

        .stat-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .stat-num {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--primary);
        }

        .section-head {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--muted);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0;
        }

        .upcoming-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--white);
            border: 1px solid var(--border);
            border-top: none;
            font-size: 0.87rem;
            gap: 16px;
        }

        .upcoming-name { flex: 1; font-weight: 600; }

        .upcoming-date { color: var(--muted); font-size: 0.82rem; min-width: 110px; }

        .upcoming-time {
            font-weight: 700;
            color: var(--primary);
            min-width: 45px;
            text-align: right;
        }

        .empty-state {
            padding: 16px;
            color: var(--muted);
            font-size: 0.87rem;
            background: var(--white);
            border: 1px solid var(--border);
            border-top: none;
        }

        .empty-state a { color: var(--primary); font-weight: 600; text-decoration: none; }

        /* ── Tables ── */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            border: 1px solid var(--border);
        }

        th, td {
            padding: 11px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        th {
            background: var(--bg);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }

        tbody tr:hover { background: rgba(15,113,240,0.03); }
        tbody tr:last-child td { border-bottom: none; }

        /* ── Calendar ── */
        .week-nav {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        #week_label {
            font-weight: 700;
            font-size: 0.9rem;
            min-width: 200px;
            text-align: center;
        }

        .cal-scroll-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(110px, 1fr));
            border: 1px solid var(--border);
            min-width: 770px;
        }

        .cal-col {
            min-width: 110px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .cal-col:last-child { border-right: none; }

        .cal-col-today .cal-header {
            background: var(--primary);
            color: white;
        }

        .cal-col-today .cal-day-name,
        .cal-col-today .cal-day-date { color: white; }

        .cal-header {
            background: var(--white);
            text-align: center;
            padding: 8px 6px;
            border-bottom: 1px solid var(--border);
        }

        .cal-day-name {
            display: block;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }

        .cal-day-date {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .cal-sessions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
            background: var(--bg);
            flex: 1;
        }

        .session-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-left: 3px solid var(--primary);
            padding: 7px 8px;
            cursor: pointer;
        }

        .session-card:hover { background: var(--primary-bg); }

        .session-card-name { font-size: 0.75rem; font-weight: 700; margin-bottom: 2px; }
        .session-card-time { font-size: 0.7rem; color: var(--primary); font-weight: 600; }
        .session-card-spaces { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
        .session-card-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 1px 6px;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: var(--primary-bg);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .cal-empty {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            padding: 12px 0;
        }

        /* ── My Bookings ── */
        .filter-tabs {
            display: flex;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .filter-tabs button {
            flex: 1;
            padding: 9px 14px;
            border: none;
            border-right: 1px solid var(--border);
            background: var(--white);
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            transition: background 0.1s, color 0.1s;
        }

        .filter-tabs button:last-child { border-right: none; }
        .filter-tabs button:hover { background: var(--bg); color: var(--text); }
        .filter-tabs button.active { background: var(--primary); color: white; }

        .booking-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-top: none;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .booking-card:first-child { border-top: 1px solid var(--border); }
        .booking-card strong { font-size: 0.9rem; font-weight: 700; display: block; }
        .booking-card p { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }
        .booking-actions { display: flex; gap: 8px; flex-shrink: 0; }

        /* ── Membership ── */
        .membership-card {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 20px 24px;
            max-width: 520px;
            margin-bottom: 24px;
        }

        .mem-status-badge {
            display: inline-block;
            padding: 3px 10px;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid;
        }

        .mem-status-active   { background: var(--success-bg); color: var(--success); border-color: rgba(22,163,74,0.3); }
        .mem-status-inactive { background: var(--danger-bg);  color: var(--danger);  border-color: rgba(212,4,4,0.3); }

        .mem-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.87rem;
        }

        .mem-detail-row:last-child { border-bottom: none; }
        .mem-label { font-weight: 700; color: var(--muted); font-size: 0.78rem; }

        .mem-section-head {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .gym-mem-options { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

        .gym-mem-option {
            flex: 1;
            min-width: 160px;
            border: 1px solid var(--border);
            padding: 16px;
            background: var(--bg);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: border-color 0.15s, background 0.15s;
        }

        .gym-mem-option:hover { border-color: var(--primary); background: var(--primary-bg); }

        .gym-mem-option-label { font-size: 0.82rem; font-weight: 700; margin-bottom: 4px; }
        .gym-mem-option-price { font-size: 1rem; font-weight: 800; color: var(--primary); }
        .gym-mem-option-desc  { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }

        #mem_purchase_section,
        #carded_purchase_section { max-width: 400px; }
        #mem_purchase_section h3,
        #carded_purchase_section h3 { margin-bottom: 16px; }

        #mem_purchase_section label,
        #carded_purchase_section label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 6px;
            margin-top: 14px;
        }

        #mem_purchase_section select,
        #mem_purchase_section input[type="date"],
        #carded_purchase_section select,
        #carded_purchase_section input[type="date"] {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
        }

        #mem_purchase_section select:focus,
        #mem_purchase_section input:focus,
        #carded_purchase_section select:focus,
        #carded_purchase_section input:focus { outline: none; border-color: var(--primary); }

        .error-msg { color: var(--danger); font-size: 0.82rem; margin-top: 8px; min-height: 1rem; }

        /* ── Modals ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 28px;
            width: 480px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h3 { margin-bottom: 16px; }

        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--border);
            gap: 1px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .modal-info-row {
            background: var(--white);
            padding: 10px 14px;
            font-size: 0.85rem;
        }

        .info-label {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .info-value { font-weight: 600; }

        .modal-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .modal-price strong { font-size: 1.1rem; color: var(--primary); font-weight: 800; }

        .modal-actions { display: flex; gap: 10px; }

        .modal-qr-box { text-align: center; max-width: 340px; }
        .modal-qr-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
        .modal-qr-box img { width: 100%; max-width: 220px; margin: 0 auto 20px; display: block; }

        /* ── Nav overlay (mobile backdrop) ── */
        #nav_overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: 150;
        }

        #nav_overlay.open { display: block; }

        /* ── Tablet (701 – 960px) ── */
        @media (max-width: 960px) {
            main { padding: 22px 20px; }
            .stats-row { grid-template-columns: 1fr 1fr; }
            .membership-card { max-width: 100%; }
        }

        /* ── Mobile (≤ 700px) ── */
        @media (max-width: 700px) {
            body { height: auto; overflow: auto; }
            .app  { height: auto; min-height: 100vh; overflow: visible; }

            #sidebar {
                position: fixed;
                top: 0; left: 0;
                height: 100%;
                transform: translateX(-220px);
                transition: transform 0.25s ease;
                z-index: 200;
            }

            #sidebar.open { transform: translateX(0); }
            .mobile-topbar { display: flex; }
            .main-wrap { overflow: visible; }
            main { overflow: visible; height: auto; padding: 16px 14px; }

            h2 { font-size: 1rem; margin-bottom: 14px; }

            /* Stats */
            .stats-row { grid-template-columns: 1fr 1fr; }
            .stat-num  { font-size: 1.5rem; }

            /* List view */
            .list-session-row { flex-wrap: wrap; gap: 4px 10px; }
            .list-session-name { width: 100%; }
            .list-session-meta { text-align: left; }

            /* My Account */
            .account-card { max-width: 100%; }
            .account-actions { flex-direction: column; }
            .account-actions button { width: 100%; min-height: 42px; }

            /* Tables */
            table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }

            /* Week navigation */
            .week-nav { flex-wrap: wrap; gap: 8px; }
            #week_label { min-width: unset; width: 100%; text-align: left; font-size: 0.82rem; order: -1; }

            /* Upcoming rows */
            .upcoming-row { flex-wrap: wrap; gap: 2px 10px; padding: 10px 12px; }
            .upcoming-name { width: 100%; }
            .upcoming-date, .upcoming-time { min-width: unset; font-size: 0.78rem; }
            .upcoming-time { text-align: left; }

            /* Modals */
            .modal-overlay { align-items: flex-start; padding: 12px; }
            .modal-box { width: 100%; max-width: 100%; padding: 18px 14px; max-height: 88vh; }
            .modal-info-grid { grid-template-columns: 1fr; }
            .modal-actions { flex-direction: column; }
            .modal-actions button { width: 100%; min-height: 42px; }

            /* Booking cards */
            .booking-card { flex-direction: column; align-items: flex-start; gap: 8px; }
            .booking-actions { display: flex; gap: 8px; width: 100%; }
            .booking-actions button { flex: 1; min-height: 40px; }

            /* Membership */
            .membership-card, #mem_purchase_section, #carded_purchase_section { max-width: 100%; }
            .gym-mem-options { flex-direction: column; }
            .gym-mem-option  { min-width: unset; width: 100%; }

            /* Filter tabs */
            .filter-tabs button { font-size: 0.75rem; padding: 10px 6px; min-height: 40px; }

            /* Touch-friendly nav */
            nav a, .nav-logout { padding: 13px 16px; min-height: 44px; display: flex; align-items: center; }

            /* General button touch targets */
            .btn-primary, .btn-ghost, .btn-danger { min-height: 42px; }
        }

        /* ── View toggle (Week / List) ── */
        .view-toggle {
            display: flex;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .view-toggle button {
            flex: 1;
            padding: 7px 14px;
            border: none;
            border-right: 1px solid var(--border);
            background: var(--white);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }

        .view-toggle button:last-child { border-right: none; }
        .view-toggle button:hover { background: var(--bg); color: var(--text); }
        .view-toggle button.active { background: var(--primary); color: white; }

        /* ── List view ── */
        .list-view { display: flex; flex-direction: column; gap: 0; }

        .list-day-group { margin-bottom: 20px; }

        .list-day-header {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            padding: 6px 0 8px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 0;
        }

        .list-day-header.today { color: var(--primary); border-bottom-color: var(--primary); }

        .list-session-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 14px;
            background: var(--white);
            border: 1px solid var(--border);
            border-top: none;
            cursor: pointer;
            transition: background 0.1s;
        }

        .list-session-row:first-of-type { border-top: 1px solid var(--border); }
        .list-session-row:hover { background: rgba(15,113,240,0.04); }

        .list-session-time {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--primary);
            min-width: 42px;
            flex-shrink: 0;
        }

        .list-session-name {
            flex: 1;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .list-session-meta {
            font-size: 0.75rem;
            color: var(--muted);
            text-align: right;
            flex-shrink: 0;
        }

        .list-session-badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .badge-booked { background: var(--success-bg); color: var(--success); border: 1px solid rgba(22,163,74,0.3); }
        .badge-covered { background: rgba(15,113,240,0.08); color: var(--primary); border: 1px solid rgba(15,113,240,0.25); }
        .badge-carded { background: var(--primary-bg); color: var(--primary); border: 1px solid var(--primary); }

        .session-card-booked { border-left-color: var(--success) !important; }

        /* ── My Account ── */
        .account-card {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 20px 24px;
            max-width: 560px;
            margin-bottom: 20px;
        }

        .account-card h3 { margin-bottom: 14px; }

        .account-form-group { margin-bottom: 14px; }

        .account-form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .account-form-group input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
        }

        .account-form-group input:focus { outline: none; border-color: var(--primary); }

        .account-readonly {
            font-size: 0.88rem;
            font-weight: 600;
            padding: 9px 0;
            color: var(--text);
        }

        .account-actions { display: flex; gap: 10px; margin-top: 18px; }

        /* ── Shop ── */
        .product-grid { display: flex; flex-wrap: wrap; gap: 16px; }

        .product-card {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 20px 24px;
            min-width: 220px;
            max-width: 300px;
            flex: 1;
        }

        .product-name { font-size: 0.95rem; font-weight: 800; margin-bottom: 6px; }
        .product-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
        .product-price { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 14px; }
        .product-msg { font-size: 0.8rem; color: var(--muted); margin-top: 8px; min-height: 1rem; }

        /* ── Scan result cards (check-in) ── */
        .scan-result-card {
            padding: 18px 20px;
            border: 1px solid var(--border);
            margin-top: 16px;
            max-width: 500px;
        }
        .scan-result-card p { font-size: 1rem; margin-bottom: 14px; font-weight: 600; }
        .scan-ok   { background: rgba(22,163,74,0.10);  border-color: rgba(22,163,74,0.3);  color: #16A34A; }
        .scan-warn { background: rgba(217,119,6,0.10);  border-color: rgba(217,119,6,0.3);  color: #D97706; }
        .scan-fail { background: rgba(212,4,4,0.08);    border-color: rgba(212,4,4,0.3);    color: var(--danger); }
    </style>
</head>
<body>

    <div class="app">
        <aside id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-name">HOP Boxing</div>
                <div class="brand-user" id="sidebar_user_name"></div>
            </div>
            <nav>
                <a href="#" id="nav_overview">Overview</a>
                <a href="#" id="nav_book_sessions">Book Sessions</a>
                <a href="#" id="nav_my_bookings">My Bookings</a>
                <a href="#" id="nav_gym_membership">Gym Membership</a>
                <a href="#" id="nav_session_passes">Tickets</a>
                <a href="#" id="nav_shop">Shop</a>
                <a href="#" id="nav_my_account">My Account</a>
            </nav>
            <div class="sidebar-footer">
                <a href="/logout" class="nav-logout">Log out</a>
            </div>
        </aside>

        <div class="main-wrap">
            <div class="mobile-topbar">
                <button id="hamburger_btn" class="hamburger-btn">&#9776;</button>
                <span class="mobile-brand">HOP Boxing</span>
            </div>
            <main id="main_content"></main>
        </div>
    </div>

    <div id="nav_overlay"></div>

    <template id="template_overview">
        <div class="view-greeting">
            <h2 id="greeting_text">Loading...</h2>
            <p class="greeting-sub" id="greeting_date"></p>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-label">Upcoming Sessions</div>
                <div class="stat-num" id="stat_total_bookings">—</div>
                <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;" id="stat_bookings_sub"></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Attendance Rate</div>
                <div class="stat-num" id="stat_attendance_rate">—</div>
                <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;" id="stat_attendance_sub"></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Membership</div>
                <div class="stat-num" id="stat_membership" style="font-size:1.1rem;line-height:1.35;margin-top:4px;">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Ticket Pass</div>
                <div class="stat-num" id="stat_pass" style="font-size:1.1rem;line-height:1.35;margin-top:4px;">—</div>
                <div style="font-size:0.72rem;color:var(--muted);margin-top:4px;" id="stat_pass_sub"></div>
            </div>
        </div>

        <div class="section-head">Upcoming Bookings</div>
        <div id="overview_upcoming"></div>

        <div class="section-head" style="margin-top:28px;">Check In</div>
        <p style="color:var(--muted);font-size:0.85rem;margin-bottom:16px;">Scan the session QR code displayed at the venue entrance to record your attendance.</p>
        <button id="btn_start_checkin_scanner" class="btn-primary">Start Scanner</button>
        <div id="checkin_scanner_container" style="margin-top:20px;max-width:500px;"></div>
    </template>

    <template id="template_checkin_result">
        <section>
            <div id="checkin_result_content"></div>
            <button id="btn_checkin_back" class="btn-ghost" style="margin-top:20px;">← Back to Overview</button>
        </section>
    </template>

    <template id="template_book_sessions">
        <h2>Book a Session</h2>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
            <div class="week-nav" style="margin-bottom:0;flex:1;min-width:200px;">
                <button id="btn_prev_week" class="btn-ghost btn-sm">&#8592; Prev</button>
                <span id="week_label" style="flex:1;text-align:center;"></span>
                <button id="btn_next_week" class="btn-ghost btn-sm">Next &#8594;</button>
            </div>
            <div class="view-toggle" style="flex-shrink:0;">
                <button id="btn_view_week" class="active">Week</button>
                <button id="btn_view_list">List</button>
            </div>
        </div>
        <div id="week_view_wrap">
            <div class="cal-scroll-wrap">
                <div id="calendar_grid" class="calendar-grid"></div>
            </div>
        </div>
        <div id="list_view_wrap" style="display:none;">
            <div id="list_view_container" class="list-view"></div>
        </div>
    </template>

    <template id="template_my_bookings">
        <h2>My Bookings</h2>
        <div class="filter-tabs">
            <button id="btn_filter_upcoming" class="active">Upcoming</button>
            <button id="btn_filter_missed">Missed</button>
            <button id="btn_filter_attended">Attended</button>
        </div>
        <div id="bookings_list"></div>
    </template>

    <template id="template_gym_membership">
        <h2>Gym Membership</h2>

        <div class="membership-card">
            <span id="gym_mem_badge" class="mem-status-badge mem-status-inactive">No Active Membership</span>
            <div id="gym_mem_details" style="display:none;">
                <div class="mem-detail-row">
                    <span class="mem-label">Type</span>
                    <span id="gym_mem_type">—</span>
                </div>
                <div class="mem-detail-row">
                    <span class="mem-label">Valid Until</span>
                    <span id="gym_mem_end_date">—</span>
                </div>
                <div class="mem-detail-row">
                    <span class="mem-label">Non-Contact Awards (1–3)</span>
                    <span id="gym_mem_nc_awards_status">—</span>
                </div>
                <div class="mem-detail-row">
                    <span class="mem-label">Contact Awards (4–6)</span>
                    <span id="gym_mem_c_awards_status">—</span>
                </div>
            </div>
        </div>

        <!-- Shown when user has an active membership but has not yet purchased all awards -->
        <div id="gym_awards_purchase_section" style="display:none;">
            <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px;">You can add Boxing Awards to your existing membership.</p>
            <div id="gym_awards_nc_row" style="display:none;margin-bottom:10px;">
                <button id="btn_buy_awards_nc" class="btn-primary">Purchase Non-Contact Awards (1–3) — <span id="price_awards_nc_display">£20.00</span></button>
            </div>
            <div id="gym_awards_c_row" style="display:none;">
                <button id="btn_buy_awards_c" class="btn-primary">Purchase Contact Awards (4–6) — <span id="price_awards_c_display">£20.00</span></button>
            </div>
            <p id="gym_awards_error_msg" class="error-msg"></p>
        </div>

        <div id="gym_mem_purchase_section">
            <p style="font-size:0.85rem;color:var(--muted);margin-bottom:16px;">One-time annual joining fee. Valid for one year from the date of purchase.</p>

            <div class="gym-mem-options">
                <button id="btn_join_non_carded" class="gym-mem-option">
                    <div class="gym-mem-option-label">Non-Carded Membership</div>
                    <div class="gym-mem-option-price" id="price_non_carded">—</div>
                    <div class="gym-mem-option-desc">Annual gym membership</div>
                </button>
                <button id="btn_join_carded" class="gym-mem-option">
                    <div class="gym-mem-option-label">Carded Membership</div>
                    <div class="gym-mem-option-price" id="price_carded">—</div>
                    <div class="gym-mem-option-desc">Annual gym membership</div>
                </button>
            </div>
            <div style="margin-top:14px;padding:14px;background:var(--bg);border:1px solid var(--border);">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.85rem;font-weight:600;">
                    <input type="checkbox" id="chk_include_awards" style="width:16px;height:16px;cursor:pointer;flex-shrink:0;">
                    <span>Add Boxing Awards Programme</span>
                    <span id="awards_addon_price" style="color:var(--primary);font-weight:800;">+£10.00</span>
                </label>
                <p style="font-size:0.72rem;color:var(--muted);margin-top:6px;margin-left:26px;">Save £10 — adding now costs £10 vs £20 if purchased later.</p>
            </div>

            <p id="gym_mem_error_msg" class="error-msg"></p>
        </div>
    </template>

    <template id="template_session_passes">
        <h2>Tickets</h2>

        <div class="membership-card">
            <span id="mem_status_badge" class="mem-status-badge mem-status-inactive">No Active Ticket</span>
            <div id="pass_details" style="display:none;">
                <div class="mem-detail-row">
                    <span class="mem-label">Type</span>
                    <span id="mem_type">—</span>
                </div>
                <div class="mem-detail-row">
                    <span class="mem-label">Start Date</span>
                    <span id="mem_start_date">—</span>
                </div>
                <div class="mem-detail-row">
                    <span class="mem-label">End Date</span>
                    <span id="mem_end_date">—</span>
                </div>
            </div>
        </div>

        <!-- Shown for non-carded members (day / weekly / monthly options) -->
        <div id="mem_purchase_section">
            <h3 style="margin-bottom:16px;">Purchase a Ticket</h3>
            <label for="mem_type_select">Ticket Type</label>
            <select id="mem_type_select">
                <option value="day">Day Ticket</option>
                <option value="weekly">Weekly Ticket</option>
                <option value="monthly">Monthly Ticket</option>
            </select>
            <label for="mem_start_input">Start Date</label>
            <input type="date" id="mem_start_input">
            <button id="btn_purchase_membership" class="btn-primary" style="margin-top:10px;">Purchase</button>
            <p id="mem_error_msg" class="error-msg"></p>
        </div>

        <!-- Shown only for senior carded members (17+): monthly pass is the only option -->
        <div id="carded_purchase_section" style="display:none;">
            <h3 style="margin-bottom:8px;">Carded Monthly Pass</h3>
            <p style="font-size:0.85rem;color:var(--muted);margin-bottom:16px;">
                Covers all eligible senior carded sessions during the paid month. Purchase a new pass each month to maintain access.
            </p>
            <label for="carded_start_input">Start Date</label>
            <input type="date" id="carded_start_input">
            <button id="btn_purchase_carded_pass" class="btn-primary" style="margin-top:10px;">Purchase Carded Monthly Pass — £40.00</button>
            <p id="carded_pass_error_msg" class="error-msg"></p>
        </div>

        <div id="covered_sessions_section" style="display:none;">
            <h3 style="margin:24px 0 12px;">Sessions Covered by Your Pass</h3>
            <table>
                <thead>
                    <tr>
                        <th>Session</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Duration</th>
                        <th>Spaces</th>
                    </tr>
                </thead>
                <tbody id="covered_sessions_body"></tbody>
            </table>
        </div>
    </template>


    <template id="template_shop">
        <h2>Shop</h2>
        <div id="shop_products"></div>
    </template>

    <div id="modal_overlay" class="modal-overlay">
        <div id="modal_box" class="modal-box">
            <h3 id="modal_session_name"></h3>

            <div class="modal-info-grid">
                <div class="modal-info-row">
                    <span class="info-label">Date</span>
                    <span class="info-value" id="modal_date"></span>
                </div>
                <div class="modal-info-row">
                    <span class="info-label">Time</span>
                    <span class="info-value" id="modal_time"></span>
                </div>
                <div class="modal-info-row">
                    <span class="info-label">Duration</span>
                    <span class="info-value" id="modal_duration"></span>
                </div>
                <div class="modal-info-row">
                    <span class="info-label">Instructor</span>
                    <span class="info-value" id="modal_instructor"></span>
                </div>
                <div class="modal-info-row">
                    <span class="info-label">Spaces Left</span>
                    <span class="info-value" id="modal_spaces"></span>
                </div>
                <div class="modal-info-row">
                    <span class="info-label">Gender</span>
                    <span class="info-value" id="modal_gender"></span>
                </div>
                <div class="modal-info-row">
                    <span class="info-label">Membership</span>
                    <span class="info-value" id="modal_membership"></span>
                </div>
                <div class="modal-info-row">
                    <span class="info-label">Age Range</span>
                    <span class="info-value" id="modal_age"></span>
                </div>
            </div>

            <div id="modal_description_row" style="display:none;margin:14px 0 0;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:0.875rem;color:var(--muted);line-height:1.5;">
                <span id="modal_description"></span>
            </div>

            <div class="modal-price">
                <span>Booking fee</span>
                <strong id="modal_price_display">—</strong>
            </div>

            <p id="error_msg" class="error-msg"></p>

            <div class="modal-actions">
                <button id="modal_btn_book" class="btn-primary">Book</button>
                <button id="modal_btn_close" class="btn-ghost">Cancel</button>
            </div>
        </div>
    </div>

    <template id="template_my_account">
        <h2>My Account</h2>
        <div class="account-card">
            <h3>Personal Details</h3>
            <div class="account-form-group">
                <label>First Name</label>
                <input type="text" id="acc_first_name">
            </div>
            <div class="account-form-group">
                <label>Last Name</label>
                <input type="text" id="acc_last_name">
            </div>
            <div class="account-form-group">
                <label>Email Address</label>
                <input type="email" id="acc_email">
            </div>
            <div class="account-form-group">
                <label>Phone Number</label>
                <input type="tel" id="acc_phone">
            </div>
            <div class="account-form-group">
                <label>Date of Birth</label>
                <div class="account-readonly" id="acc_dob">—</div>
            </div>
            <div class="account-form-group">
                <label>Gender</label>
                <div class="account-readonly" id="acc_gender">—</div>
            </div>
            <p id="acc_error_msg" class="error-msg"></p>
            <p id="acc_success_msg" style="color:var(--success);font-size:0.82rem;margin-top:8px;min-height:1rem;"></p>
            <div class="account-actions">
                <button id="btn_acc_save" class="btn-primary">Save Changes</button>
            </div>
        </div>

        <div class="account-card">
            <h3>Gym Membership</h3>
            <div id="acc_gym_mem_content"><p style="color:var(--muted);font-size:0.87rem;">Loading...</p></div>
        </div>

        <div class="account-card">
            <h3>Ticket Pass</h3>
            <div id="acc_pass_content"><p style="color:var(--muted);font-size:0.87rem;">Loading...</p></div>
        </div>
    </template>

<div id="modal_cancel_overlay" class="modal-overlay">
        <div class="modal-box" style="max-width:400px;">
            <h3>Cancel Booking</h3>
            <p style="color:var(--muted);font-size:0.88rem;margin-bottom:18px;">Are you sure you want to cancel <strong id="modal_cancel_session_name" style="color:var(--text);"></strong>? This cannot be undone.</p>
            <div class="modal-actions">
                <button id="modal_cancel_btn_confirm" class="btn-danger">Yes, Cancel</button>
                <button id="modal_cancel_btn_close" class="btn-ghost">Go Back</button>
            </div>
        </div>
    </div>

<script src="/node_modules/html5-qrcode/html5-qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
