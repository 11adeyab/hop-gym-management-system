<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — HOP Boxing Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:    #0F71F0;
            --primary-bg: #B2D4FC;
            --bg:         #F4F4F4;
            --white:      #FFFFFF;
            --border:     #E0E0E0;
            --text:       #1A1A1A;
            --muted:      #A1A1A1;
            --danger:     #D40404;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ── */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 48px;
            height: 56px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 0; }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            padding: 0 18px;
            height: 56px;
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            border-left: 1px solid var(--border);
            transition: color 0.15s, background 0.15s;
        }

        .nav-links a:hover { color: var(--text); background: var(--bg); }
        .nav-links .nav-active { color: var(--primary); }

        /* ── Page body ── */
        .page-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        /* ── Card ── */
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .card-eyebrow {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .card .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.15s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        input::placeholder { color: var(--muted); }

        .btn-submit {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: var(--primary);
            color: var(--white);
            border: none;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0.04em;
            transition: background 0.15s;
        }

        .btn-submit:hover { background: #0a5ec4; }

        #error_msg {
            color: var(--danger);
            font-size: 0.82rem;
            margin-top: 10px;
            min-height: 1.1rem;
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .form-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .form-footer a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            nav { padding: 0 16px; }
            .nav-links a { padding: 0 14px; }
            .card { padding: 28px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="nav-logo">HOP Boxing</a>
        <div class="nav-links">
            <a href="/login" class="nav-active">Login</a>
            <a href="/register">Register</a>
        </div>
    </nav>

    <div class="page-body">
        <div class="card">
            <p class="card-eyebrow">HOP Boxing Academy</p>
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to your account to manage bookings</p>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password">

            <button id="btn_submit_login" class="btn-submit">Sign In</button>
            <p id="error_msg"></p>

            <p class="form-footer">Don't have an account? <a href="/register">Register here</a></p>
        </div>
    </div>

    <script src="./src/login.js"></script>
</body>
</html>
